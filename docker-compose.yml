services:
  pia:
    build:
      context: .
      dockerfile: Dockerfile
    image: pia-portal:2.0.0
    container_name: pia-portal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - pia_data:/var/lib/pia/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pia_data:
    name: pia_data
